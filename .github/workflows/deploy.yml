
name: Deploy ImmoZen Casablanca

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Casablanca to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "❌ VPS_HOST est vide"
            exit 1
          fi

          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "❌ VPS_USER est vide"
            exit 1
          fi

          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ VPS_SSH_KEY est vide"
            exit 1
          fi

          echo "✅ VPS_HOST présent"
          echo "✅ VPS_USER présent"
          echo "✅ VPS_SSH_KEY présent"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Déploiement ImmoZen Casablanca..."

            cd /var/www/immozen-casablanca

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm run build

            pm2 restart immozen-casablanca
            pm2 save

            echo "✅ Deploiement terminé !"
